name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built without the PUBLIC_UMAMI_* vars on purpose: the tracker lives on a
      # remote instance, and letting CI fetch it would make the scores depend on
      # that instance being up. This audits our own output, nothing else.
      - run: npm run build

      - run: npx --yes @lhci/cli@0.15.x autorun
